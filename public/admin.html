<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de contact - Administration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#1c2b2d;
    --paper:#eef0ea;
    --line:#c9cdc0;
    --moss:#3c5a4e;
    --clay:#a8552f;
    --card:#ffffff;
    --muted:#6b7570;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{width:100%;max-width:540px;}
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:28px;
  }
  .panel h1{font-size:20px;margin:0 0 4px;font-weight:600;}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
  .panel input{
    width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:2px;font-size:14px;font-family:inherit;background:#fbfbf9;
  }
  .save-btn, .ghost-btn{
    margin-top:20px;padding:11px 16px;border-radius:2px;font-size:14px;
    font-family:inherit;cursor:pointer;
  }
  .save-btn{background:var(--ink);color:#fff;border:none;}
  .ghost-btn{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .stat-row{display:flex;gap:12px;margin:22px 0;}
  .stat{flex:1;border:1px solid var(--line);padding:14px;text-align:center;}
  .stat .num{font-size:24px;font-family:"Iowan Old Style",Georgia,serif;font-weight:bold;}
  .stat .lab{font-size:11px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:500;font-size:11px;}
  .qr-box{display:flex;justify-content:center;margin:18px 0;padding:20px;border:1px solid var(--line);background:#fff;}
  .small{font-size:11px;color:var(--muted);}
  .lockscreen{max-width:320px;margin:40px auto;}
  .tabbar{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tabbar button{
    flex:1;background:none;border:none;padding:10px 0;font-family:inherit;
    font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tabbar button.active{color:var(--ink);border-bottom-color:var(--clay);font-weight:600;}
  .hidden{display:none;}
  .msg{font-size:12px;margin-top:8px;}
  .msg.err{color:var(--clay);}
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
const stage = document.getElementById('stage');

function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
}

function renderLogin() {
  stage.innerHTML = `
    <div class="panel lockscreen">
      <h1>Tableau de bord</h1>
      <p class="sub">Code PIN requis</p>
      <input type="password" id="pinInput" placeholder="Code ADMIN_PIN" maxlength="32">
      <button class="save-btn" id="pinGo" style="width:100%">Déverrouiller</button>
      <p class="msg err hidden" id="pinErr">Code incorrect ou accès refusé.</p>
    </div>
  `;

  const submit = async () => {
    const pin = document.getElementById('pinInput').value.trim();
    const err = document.getElementById('pinErr');
    err.classList.add('hidden');

    try {
      const res = await fetch(`/stats?pin=${encodeURIComponent(pin)}`);
      if (!res.ok) throw new Error();
      const scans = await res.json();
      renderDashboard(scans);
    } catch {
      err.classList.remove('hidden');
    }
  };

  document.getElementById('pinGo').onclick = submit;
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
  });
}

function renderDashboard(scans) {
  const scanUrl = `${location.origin}/scan`;

  stage.innerHTML = `
    <div class="panel">
      <h1>Tableau de bord</h1>
      <p class="sub">Statistiques de suivi de votre carte</p>
      <div class="tabbar">
        <button class="tab-btn active" data-tab="stats">Scans</button>
        <button class="tab-btn" data-tab="qr">QR code</button>
      </div>
      <div id="tab-stats"></div>
      <div id="tab-qr" class="hidden"></div>
    </div>
  `;

  const cities = {};
  scans.forEach(s => {
    const k = s.city ? (s.city + (s.country ? ', ' + s.country : '')) : 'Inconnue';
    cities[k] = (cities[k] || 0) + 1;
  });
  const topCity = Object.entries(cities).sort((a, b) => b[1] - a[1])[0];

  document.getElementById('tab-stats').innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${scans.length}</div><div class="lab">Scans totaux</div></div>
      <div class="stat"><div class="num">${scans.filter(s => new Date(s.ts).toDateString() === new Date().toDateString()).length}</div><div class="lab">Aujourd'hui</div></div>
      <div class="stat"><div class="num" style="font-size:14px;padding-top:4px;">${topCity ? topCity[0] : '-'}</div><div class="lab">Top localisation</div></div>
    </div>
    ${scans.length === 0 ? '<p class="small">Aucun scan enregistré pour l\'instant.</p>' : `
    <table>
      <thead><tr><th>Date</th><th>Localisation approx.</th><th>Appareil</th></tr></thead>
      <tbody>
        ${scans.slice(0, 50).map(s => `
          <tr>
            <td>${fmtDate(s.ts)}</td>
            <td>${s.city ? s.city + (s.country ? ', ' + s.country : '') : 'Inconnue'}</td>
            <td>${s.device || 'Inconnu'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  `;

  document.getElementById('tab-qr').innerHTML = `
    <p class="small">Ce QR code pointe vers le lien de téléchargement direct <code>/scan</code>.</p>
    <div class="qr-box"><div id="qrHolder"></div></div>
    <p class="small" style="word-break:break-all;text-align:center;">${scanUrl}</p>
    <button class="ghost-btn" id="dlqr" style="width:100%">Télécharger le QR (PNG)</button>
  `;

  new QRCode(document.getElementById('qrHolder'), {
    text: scanUrl,
    width: 200,
    height: 200,
    colorDark: "#1c2b2d",
    colorLight: "#ffffff"
  });

  document.getElementById('dlqr').onclick = () => {
    const img = document.querySelector('#qrHolder img') || document.querySelector('#qrHolder canvas');
    if (!img) return;
    const dataUrl = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'qr-contact.png';
    a.click();
  };

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['stats', 'qr'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
      });
    };
  });
}

renderLogin();
</script>
</body>
</html>
